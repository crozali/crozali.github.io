<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CROZALI — Чоловіче та Жіноче Шкіряне Взуття</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body {
            background-color: #0a0a0c;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Chaos / Organic Plus Grid Background */
        .chaos-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
            background-image: 
                radial-gradient(circle at 12px 12px, rgba(255, 255, 255, 0.45) 2px, transparent 2px),
                radial-gradient(circle at 48px 36px, rgba(255, 255, 255, 0.35) 1.5px, transparent 1.5px),
                radial-gradient(circle at 84px 18px, rgba(255, 255, 255, 0.5) 2px, transparent 2px),
                linear-gradient(to right, transparent 11px, rgba(255, 255, 255, 0.3) 11px, rgba(255, 255, 255, 0.3) 13px, transparent 13px),
                linear-gradient(to bottom, transparent 11px, rgba(255, 255, 255, 0.3) 11px, rgba(255, 255, 255, 0.3) 13px, transparent 13px),
                linear-gradient(to right, transparent 53px, rgba(255, 255, 255, 0.2) 53px, rgba(255, 255, 255, 0.2) 55px, transparent 55px),
                linear-gradient(to bottom, transparent 23px, rgba(255, 255, 255, 0.2) 23px, rgba(255, 255, 255, 0.2) 25px, transparent 25px);
            background-size: 96px 96px, 120px 120px, 80px 80px, 48px 48px, 48px 48px, 96px 96px, 96px 96px;
            opacity: 0.85;
        }

        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Glassmorphism Navigation */
        .nav-blur {
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Skeleton Loading Animation */
        .skeleton {
            background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Product Card & Modal UI Styles */
        .product-card {
            background: #121215;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 20px 40px -15px rgba(59, 130, 246, 0.15);
        }

        .slider-btn {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        .slider-btn:hover {
            background: rgba(59, 130, 246, 0.8);
            border-color: #3b82f6;
        }

        .indicator-dot {
            height: 4px;
            border-radius: 9999px;
            transition: all 0.3s ease;
        }

        .indicator-active {
            width: 20px;
            background-color: #3b82f6;
        }

        .indicator-inactive {
            width: 6px;
            background-color: rgba(255, 255, 255, 0.3);
        }

        .admin-input {
            width: 100%;
            background: #18181b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: white;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .admin-input:focus {
            border-color: #3b82f6;
        }

        .social-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        .social-icon:hover {
            transform: scale(1.1);
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        /* Discount Badges */
        .badge-yellow {
            background: #eab308;
            color: #000000;
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.4);
        }

        .badge-red {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0c;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="chaos-bg"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBSmzapB-gtDeQNVq-M7GuJFPoXf2_94aU",
            authDomain: "crozali-shop.firebaseapp.com",
            databaseURL: "https://crozali-shop-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "crozali-shop",
            storageBucket: "crozali-shop.firebasestorage.app",
            messagingSenderId: "50262512045",
            appId: "1:50262512045:web:a996b63a47480abd941124",
            measurementId: "G-DR6LXXC8QX"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const auth = firebase.auth();

        const ADMIN_EMAIL = "admin@crozali.local";

        // Initial Sample Demo Data (used when Database is empty)
        const SAMPLE_PRODUCTS = [
            {
                id: "demo1",
                name: "Шкіряні Челсі Classic Black",
                price: "3499",
                oldPrice: "3999",
                gender: "male",
                description: "Преміальна натуральна шкіра гладкої фактури. Зручні еластичні вставки та зносостійка підошва. Ідеально для повсякденного носіння та ділового стилю.",
                images: [
                    "https://images.unsplash.com/photo-1638247025967-b4e38f787b76?w=800&auto=format&fit=crop&q=60",
                    "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=800&auto=format&fit=crop&q=60"
                ]
            },
            {
                id: "demo2",
                name: "Жіночі Шкіряні Черевики Urban",
                price: "2499",
                oldPrice: "3299",
                gender: "female",
                description: "Ніжна шкіра теляти, байкова утеплена підкладка та масивна тракторна підошва. Комфортна колодка для прогулянок містом.",
                images: [
                    "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=800&auto=format&fit=crop&q=60",
                    "https://images.unsplash.com/photo-1515347619252-60a4bf4fff4f?w=800&auto=format&fit=crop&q=60"
                ]
            },
            {
                id: "demo3",
                name: "Чоловічі Лофери Premium Leather",
                price: "2999",
                oldPrice: "",
                gender: "male",
                description: "Ручна робота, 100% натуральна шкіра преміум класу. Шкіряна устілка з анатомічною підтримкою.",
                images: [
                    "https://images.unsplash.com/photo-1614252235316-8c857d38b5f4?w=800&auto=format&fit=crop&q=60",
                    "https://images.unsplash.com/photo-1533867617858-e7b97e060509?w=800&auto=format&fit=crop&q=60"
                ]
            }
        ];

        // Helper function to calculate discount percentage
        const calcDiscount = (price, oldPrice) => {
            const p = parseFloat(String(price).replace(/\s+/g, ''));
            const op = parseFloat(String(oldPrice).replace(/\s+/g, ''));
            if (isNaN(p) || isNaN(op) || op <= p) return 0;
            return Math.round(((op - p) / op) * 100);
        };

        const ProductCard = React.memo(({ product, onOpen, isAdmin, onDelete, onEdit }) => {
            const [currentImg, setCurrentImg] = useState(0);
            const [isLoaded, setIsLoaded] = useState(false);

            const discountPercent = calcDiscount(product.price, product.oldPrice);

            useEffect(() => {
                setIsLoaded(false);
            }, [currentImg, product.images]);

            const next = useCallback((e) => { 
                e.stopPropagation();
                if (!product.images || product.images.length === 0) return;
                setCurrentImg(prev => (prev === product.images.length - 1 ? 0 : prev + 1));
            }, [product.images]);

            const prev = useCallback((e) => { 
                e.stopPropagation();
                if (!product.images || product.images.length === 0) return;
                setCurrentImg(prev => (prev === 0 ? product.images.length - 1 : prev - 1));
            }, [product.images]);

            return (
                <div onClick={() => onOpen(product)} className="product-card rounded-3xl overflow-hidden flex flex-col h-full group relative cursor-pointer">
                    {/* Discount Badge */}
                    {discountPercent > 0 && (
                        <div className={`absolute top-4 left-4 z-30 px-3 py-1 rounded-full text-xs font-black tracking-wider uppercase ${discountPercent <= 20 ? 'badge-yellow' : 'badge-red'}`}>
                            -{discountPercent}%
                        </div>
                    )}

                    {isAdmin && (
                        <div className="absolute top-4 right-4 z-[60] flex gap-2">
                            <button 
                                title="Редагувати"
                                onClick={(e) => { e.stopPropagation(); onEdit(product); }} 
                                className="bg-blue-600/90 hover:bg-blue-600 w-9 h-9 rounded-full flex items-center justify-center font-bold text-white shadow-lg hover:scale-110 transition"
                            >
                                ✎
                            </button>
                            <button 
                                title="Видалити"
                                onClick={(e) => { e.stopPropagation(); onDelete(product.id); }} 
                                className="bg-red-600/90 hover:bg-red-600 w-9 h-9 rounded-full flex items-center justify-center font-bold text-white shadow-lg hover:scale-110 transition"
                            >
                                ✕
                            </button>
                        </div>
                    )}

                    <div className="relative h-72 overflow-hidden bg-black/40">
                        {!isLoaded && (
                            <div className="absolute inset-0 z-10 skeleton flex flex-col items-center justify-center">
                                <div className="w-8 h-8 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin mb-2"></div>
                                <span className="text-[10px] text-gray-400 uppercase tracking-widest font-bold">Завантаження...</span>
                            </div>
                        )}

                        <img 
                            src={product.images && product.images.length > 0 ? product.images[currentImg] : 'https://via.placeholder.com/600x600?text=Немає+фото'} 
                            onLoad={() => setIsLoaded(true)}
                            className={`w-full h-full object-cover transition-opacity duration-500 ${isLoaded ? 'opacity-100' : 'opacity-0'}`} 
                            alt={product.name}
                        />

                        {product.images && product.images.length > 1 && (
                            <>
                                <div className="absolute inset-0 z-20 flex items-center justify-between px-3 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
                                    <button onClick={prev} className="slider-btn pointer-events-auto w-9 h-9 rounded-full text-white flex items-center justify-center shadow-lg">❮</button>
                                    <button onClick={next} className="slider-btn pointer-events-auto w-9 h-9 rounded-full text-white flex items-center justify-center shadow-lg">❯</button>
                                </div>

                                <div className="absolute bottom-4 left-0 right-0 z-20 flex justify-center gap-1.5 pointer-events-none">
                                    {product.images.map((_, idx) => (
                                        <div key={idx} className={`indicator-dot ${idx === currentImg ? 'indicator-active' : 'indicator-inactive'}`}></div>
                                    ))}
                                </div>
                            </>
                        )}
                    </div>

                    <div className="p-6 flex flex-col flex-grow text-left">
                        <h3 className="text-xl font-bold mb-2 group-hover:text-blue-400 transition-colors">{product.name}</h3>
                        <p className="text-gray-400 text-sm mb-6 flex-grow line-clamp-2 leading-relaxed">{product.description}</p>
                        <div className="flex justify-between items-end mt-auto pt-4 border-t border-white/5">
                            <div className="flex items-baseline gap-2 flex-wrap">
                                {product.oldPrice && parseFloat(String(product.oldPrice).replace(/\s+/g, '')) > parseFloat(String(product.price).replace(/\s+/g, '')) && (
                                    <span className="text-sm font-semibold text-gray-500 line-through">
                                        {product.oldPrice} ₴
                                    </span>
                                )}
                                <span className="text-2xl font-black text-blue-500">{product.price} ₴</span>
                            </div>
                            <span className="text-blue-400 text-sm font-bold underline hover:text-blue-300 transition pb-0.5">Детальніше</span>
                        </div>
                    </div>
                </div>
            );
        });

        function Modal({ product, onClose }) {
            const [currentImg, setCurrentImg] = useState(0);
            const [isLoaded, setIsLoaded] = useState(false);
            const phone = "380673485909";
            const msg = encodeURIComponent("Добрий день! Цікавить модель: " + product.name);
            const viberUrl = `viber://chat?number=%2B${phone}`;
            const whatsappUrl = `https://wa.me/${phone}?text=${msg}`;

            const discountPercent = calcDiscount(product.price, product.oldPrice);

            useEffect(() => { 
                document.body.style.overflow = 'hidden'; 
                return () => { document.body.style.overflow = 'unset'; }; 
            }, []);

            return (
                <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex items-center justify-center p-4 md:p-8" onClick={onClose}>
                    <div className="bg-[#121215] w-full max-w-5xl max-h-[90vh] rounded-3xl overflow-hidden flex flex-col md:flex-row relative border border-white/10 shadow-2xl" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-4 right-4 z-20 w-10 h-10 bg-black/60 hover:bg-red-600 rounded-full text-white text-xl flex items-center justify-center transition-colors">✕</button>

                        <div className="w-full md:w-3/5 h-[350px] md:h-auto relative bg-black flex items-center justify-center">
                            {discountPercent > 0 && (
                                <div className={`absolute top-4 left-4 z-30 px-3.5 py-1.5 rounded-full text-xs font-black tracking-wider uppercase ${discountPercent <= 20 ? 'badge-yellow' : 'badge-red'}`}>
                                    Акція -{discountPercent}%
                                </div>
                            )}

                            {!isLoaded && <div className="absolute inset-0 skeleton flex items-center justify-center text-blue-500 animate-pulse font-bold">Crozali...</div>}
                            <img 
                                src={product.images && product.images.length > 0 ? product.images[currentImg] : ''} 
                                onLoad={() => setIsLoaded(true)}
                                className={`max-w-full max-h-full object-contain transition-opacity duration-300 ${isLoaded ? 'opacity-100' : 'opacity-0'}`} 
                                alt={product.name}
                            />
                            {product.images && product.images.length > 1 && (
                                <div className="absolute inset-0 flex items-center justify-between px-4">
                                    <button onClick={() => { setCurrentImg(prev => (prev === 0 ? product.images.length - 1 : prev - 1)); setIsLoaded(false); }} className="slider-btn w-11 h-11 rounded-full text-white flex items-center justify-center">❮</button>
                                    <button onClick={() => { setCurrentImg(prev => (prev === product.images.length - 1 ? 0 : prev + 1)); setIsLoaded(false); }} className="slider-btn w-11 h-11 rounded-full text-white flex items-center justify-center">❯</button>
                                </div>
                            )}
                        </div>

                        <div className="w-full md:w-2/5 p-8 flex flex-col overflow-y-auto">
                            <h2 className="text-3xl font-black mb-3 leading-tight">{product.name}</h2>
                            <div className="flex items-baseline gap-3 mb-6">
                                {product.oldPrice && parseFloat(String(product.oldPrice).replace(/\s+/g, '')) > parseFloat(String(product.price).replace(/\s+/g, '')) && (
                                    <span className="text-lg font-semibold text-gray-500 line-through">
                                        {product.oldPrice} ₴
                                    </span>
                                )}
                                <div className="text-3xl font-black text-blue-500">{product.price} ₴</div>
                            </div>
                            
                            <div className="mb-8 flex-grow">
                                <h4 className="text-gray-400 uppercase text-xs font-bold tracking-widest mb-2">Опис моделі</h4>
                                <p className="text-gray-300 leading-relaxed text-base">{product.description}</p>
                                
                                <div className="mt-6 p-4 bg-white/5 rounded-2xl border border-white/5 text-xs text-gray-400 space-y-1">
                                    <p>✔ 100% Натуральна шкіра</p>
                                    <p>✔ Гарантія якості від майстерні</p>
                                    <p>✔ Доставка по всій Україні</p>
                                </div>
                            </div>

                            <div className="space-y-3 pt-4 border-t border-white/5">
                                <a href={viberUrl} className="w-full bg-[#7360f2] text-white py-3.5 rounded-2xl font-bold hover:bg-[#6251d4] transition-colors text-center flex items-center justify-center gap-2"><span>💜</span> Написати у Viber</a>
                                <a href={whatsappUrl} className="w-full bg-[#25D366] text-white py-3.5 rounded-2xl font-bold hover:bg-[#1ebd5b] transition-colors text-center flex items-center justify-center gap-2"><span>🟢</span> Написати у WhatsApp</a>
                                <a href={`tel:${phone}`} className="w-full bg-white text-black py-3.5 rounded-2xl font-bold hover:bg-gray-200 transition-colors text-center flex items-center justify-center gap-2"><span>📞</span> Подзвонити майстру</a>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [products, setProducts] = useState([]);
            const [filter, setFilter] = useState('all');
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [editingProduct, setEditingProduct] = useState(null);
            
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [loginPass, setLoginPass] = useState('');
            const [loginBusy, setLoginBusy] = useState(false);

            const [showAddForm, setShowAddForm] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [newItem, setNewItem] = useState({
                name: '', price: '', oldPrice: '', description: '', img1: '', img2: '', img3: '', gender: 'male'
            });

            const phone = "380673485909";

            useEffect(() => {
                const unsubscribeAuth = auth.onAuthStateChanged(user => {
                    setIsAdmin(!!user);
                });

                const productsRef = db.ref('products');
                const handleValue = (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const productList = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        setProducts(productList.reverse());
                    } else {
                        setProducts(SAMPLE_PRODUCTS);
                    }
                };

                productsRef.on('value', handleValue, (err) => {
                    console.error("Firebase read error:", err);
                    setProducts(SAMPLE_PRODUCTS);
                });

                return () => {
                    unsubscribeAuth();
                    productsRef.off('value', handleValue);
                };
            }, []);

            const handleLogin = async () => {
                if (!loginPass) return alert("Введіть пароль!");
                setLoginBusy(true);
                try {
                    await auth.signInWithEmailAndPassword(ADMIN_EMAIL, loginPass);
                    setShowLogin(false);
                    setLoginPass('');
                } catch (err) {
                    alert("Помилка входу: " + err.message);
                } finally {
                    setLoginBusy(false);
                }
            };

            const handleLogout = async () => {
                try {
                    await auth.signOut();
                    setShowAddForm(false);
                    setEditingProduct(null);
                } catch (err) {
                    console.error("Sign-out error:", err);
                }
            };

            const handleAddProduct = async () => {
                const images = [newItem.img1, newItem.img2, newItem.img3]
                    .map(img => img ? img.trim() : '')
                    .filter(url => url !== '');

                if (!newItem.name.trim()) return alert("Будь ласка, вкажіть назву товару!");
                if (!newItem.price.trim()) return alert("Будь ласка, вкажіть ціну товару!");
                if (images.length === 0) return alert("Будь ласка, вкажіть хоча б одне посилання на фото (Фото 1)!");

                setIsSubmitting(true);
                
                try {
                    const newRef = db.ref('products').push();
                    await newRef.set({
                        name: newItem.name.trim(),
                        price: newItem.price.trim(),
                        oldPrice: newItem.oldPrice ? newItem.oldPrice.trim() : '',
                        description: newItem.description ? newItem.description.trim() : '',
                        gender: newItem.gender || 'male',
                        images: images,
                        createdAt: Date.now()
                    });

                    setNewItem({ name: '', price: '', oldPrice: '', description: '', img1: '', img2: '', img3: '', gender: 'male' });
                    setShowAddForm(false);
                    alert("Товар успішно додано!");
                } catch (error) {
                    console.error("Firebase Add Error:", error);
                    if (error.code === 'PERMISSION_DENIED') {
                        alert("Помилка доступу: У вас немає прав адміністратора для цієї дії. Перевірте Firebase Rules.");
                    } else {
                        alert("Помилка додавання: " + error.message);
                    }
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleUpdateProduct = async () => {
                if (!editingProduct.price) return alert("Ціна не може бути порожньою!");
                try {
                    await db.ref('products/' + editingProduct.id).update({
                        name: editingProduct.name,
                        price: editingProduct.price,
                        oldPrice: editingProduct.oldPrice || '',
                        description: editingProduct.description || '',
                        gender: editingProduct.gender || 'male'
                    });
                    setEditingProduct(null);
                    alert("Зміни успішно збережено!");
                } catch (error) {
                    console.error("Firebase Update Error:", error);
                    if (error.code === 'PERMISSION_DENIED') {
                        alert("Помилка доступу: відхилено правилами Firebase Rules.");
                    } else {
                        alert("Помилка оновлення: " + error.message);
                    }
                }
            };

            const handleDeleteProduct = async (id) => {
                if (window.confirm('Ви впевнені, що хочете видалити цей товар?')) {
                    try {
                        await db.ref('products/' + id).remove();
                    } catch (error) {
                        console.error("Firebase Delete Error:", error);
                        if (error.code === 'PERMISSION_DENIED') {
                            alert("Помилка доступу: відхилено правилами Firebase Rules.");
                        } else {
                            alert("Помилка видалення: " + error.message);
                        }
                    }
                }
            };

            const filtered = useMemo(() => 
                products.filter(p => filter === 'all' || p.gender === filter),
                [products, filter]
            );

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Navigation Bar */}
                    <nav className="fixed top-0 w-full z-50 nav-blur">
                        <div className="max-w-6xl mx-auto px-6 h-20 flex justify-between items-center">
                            <span className="text-2xl font-black tracking-tighter text-white">CROZALI<span className="text-blue-500">.</span></span>
                            <div className="flex gap-6 md:gap-8 text-xs md:text-sm font-bold uppercase tracking-widest text-gray-300">
                                <a href="#catalog" className="hover:text-blue-500 transition">Каталог</a>
                                <a href="#about" className="hover:text-blue-500 transition">Про нас</a>
                                <a href="#contacts" className="hover:text-blue-500 transition">Контакти</a>
                                {isAdmin && (
                                    <button onClick={() => setShowAddForm(true)} className="text-blue-500 hover:text-blue-400 font-extrabold flex items-center gap-1">
                                        <span>+</span> Додати товар
                                    </button>
                                )}
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section className="pt-48 pb-20 px-6 text-center max-w-5xl mx-auto">
                        <span className="inline-block bg-blue-500/10 text-blue-400 border border-blue-500/20 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest mb-6">
                            Авторське взуття ручної роботи
                        </span>
                        <h1 className="text-5xl md:text-7xl font-black mb-6 gradient-text tracking-tight uppercase leading-tight">
                            Крокуй у майбутнє <br/> з комфортом
                        </h1>
                        <p className="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto mb-10 italic">
                            "Найкращий спосіб передбачити майбутнє — створити його власним кроком."
                        </p>
                        <a href="#catalog" className="inline-block bg-blue-600 px-10 py-4 rounded-2xl font-extrabold text-white hover:bg-blue-500 transition shadow-xl shadow-blue-500/20 uppercase tracking-widest text-sm">
                            ПЕРЕГЛЯНУТИ КАТАЛОГ
                        </a>
                    </section>

                    {/* Catalog Section */}
                    <section id="catalog" className="py-20 px-6 max-w-6xl mx-auto w-full flex-grow">
                        <div className="flex flex-col items-center text-center mb-16 gap-6">
                            <div>
                                <h2 className="text-4xl font-black mb-2">Наш каталог</h2>
                                <p className="text-gray-500 tracking-wide uppercase text-xs font-bold">Обирай свою ідеальну пару</p>
                            </div>
                            
                            {/* Category Filter */}
                            <div className="flex flex-wrap justify-center bg-[#121215] p-1.5 rounded-2xl border border-white/5">
                                {[
                                    { id: 'all', label: 'Всі моделі' },
                                    { id: 'male', label: 'Чоловіче' },
                                    { id: 'female', label: 'Жіноче' }
                                ].map(type => (
                                    <button 
                                        key={type.id} 
                                        onClick={() => setFilter(type.id)} 
                                        className={`px-6 py-2.5 rounded-xl text-xs md:text-sm font-bold transition ${filter === type.id ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-white'}`}
                                    >
                                        {type.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Products Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {filtered.map(p => (
                                <ProductCard 
                                    key={p.id} 
                                    product={p} 
                                    isAdmin={isAdmin} 
                                    onDelete={handleDeleteProduct} 
                                    onEdit={setEditingProduct}
                                    onOpen={setSelectedProduct} 
                                />
                            ))}
                        </div>
                    </section>

                    {/* Modal Product Details */}
                    {selectedProduct && <Modal product={selectedProduct} onClose={() => setSelectedProduct(null)} />}

                    {/* Modal Edit Product */}
                    {editingProduct && (
                        <div className="fixed inset-0 z-[400] bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-[#121215] p-8 rounded-3xl border border-blue-500/40 w-full max-w-lg shadow-2xl">
                                <h2 className="text-2xl font-bold mb-6 text-blue-500 uppercase">Редагувати дані</h2>
                                
                                <label className="text-xs text-gray-400 uppercase font-bold block mb-1">Назва моделі</label>
                                <input 
                                    value={editingProduct.name} 
                                    className="admin-input" 
                                    onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} 
                                />

                                <div className="grid grid-cols-2 gap-4 mb-2">
                                    <div>
                                        <label className="text-xs text-gray-400 uppercase font-bold block mb-1">Ціна (₴)</label>
                                        <input 
                                            value={editingProduct.price} 
                                            type="number" 
                                            className="admin-input" 
                                            onChange={e => setEditingProduct({...editingProduct, price: e.target.value})} 
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-400 uppercase font-bold block mb-1">Стара ціна (для знижки)</label>
                                        <input 
                                            value={editingProduct.oldPrice || ''} 
                                            type="number" 
                                            placeholder="напр. 3999"
                                            className="admin-input" 
                                            onChange={e => setEditingProduct({...editingProduct, oldPrice: e.target.value})} 
                                        />
                                    </div>
                                </div>

                                <label className="text-xs text-gray-400 uppercase font-bold block mb-1">Категорія</label>
                                <select 
                                    className="admin-input" 
                                    value={editingProduct.gender || 'male'} 
                                    onChange={e => setEditingProduct({...editingProduct, gender: e.target.value})}
                                >
                                    <option value="male">Чоловіче взуття</option>
                                    <option value="female">Жіноче взуття</option>
                                </select>

                                <label className="text-xs text-gray-400 uppercase font-bold block mb-1">Опис</label>
                                <textarea 
                                    value={editingProduct.description} 
                                    className="admin-input h-32" 
                                    onChange={e => setEditingProduct({...editingProduct, description: e.target.value})} 
                                />

                                <div className="flex gap-4 mt-4">
                                    <button onClick={handleUpdateProduct} className="flex-1 bg-blue-600 hover:bg-blue-500 py-3.5 rounded-xl font-bold text-white transition">ЗБЕРЕГТИ ЗМІНИ</button>
                                    <button onClick={() => setEditingProduct(null)} className="flex-1 bg-white/5 hover:bg-white/10 py-3.5 rounded-xl font-bold text-gray-300 transition">СКАСУВАТИ</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* About Section */}
                    <section id="about" className="py-20 bg-[#121215] border-y border-white/5">
                        <div className="max-w-4xl mx-auto px-6 text-center">
                            <h2 className="text-3xl md:text-4xl font-black mb-6 text-blue-500">Ми — Crozali</h2>
                            <div className="text-gray-300 space-y-4 text-base md:text-lg leading-relaxed font-medium">
                                <p>Понад 8 років ми шиємо для наших клієнтів якісне шкіряне взуття, що поєднує витончений стиль та повсякденний комфорт.</p>
                                <p>Наша місія — виготовляти найкраще взуття з натуральних матеріалів з гарантією надійності. Також приймаємо індивідуальні замовлення.</p>
                            </div>
                        </div>
                    </section>

                    {/* Footer & Contacts */}
                    <footer id="contacts" className="py-20 px-6 max-w-6xl mx-auto text-white w-full">
                        <div className="grid md:grid-cols-2 gap-12 items-center">
                            <div className="text-center md:text-left">
                                <h2 className="text-4xl md:text-5xl font-black mb-6">Є питання? <br/><span className="text-blue-500">Ми на зв'язку.</span></h2>
                                <div className="space-y-6">
                                    <a href={`tel:${phone}`} className="flex items-center justify-center md:justify-start gap-4 text-2xl font-bold hover:text-blue-500 transition">
                                        <span className="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center border border-white/10">📞</span>
                                        067 348 59 09
                                    </a>
                                    <div className="flex flex-wrap justify-center md:justify-start gap-3 pt-2">
                                        <a href={`viber://chat?number=%2B${phone}`} title="Viber" className="social-icon w-12 h-12 rounded-2xl flex items-center justify-center text-xl">💜</a>
                                        <a href={`https://wa.me/${phone}`} target="_blank" title="WhatsApp" className="social-icon w-12 h-12 rounded-2xl flex items-center justify-center text-xl">🟢</a>
                                        <a href="https://t.me/crozali" target="_blank" title="Telegram" className="social-icon w-12 h-12 rounded-2xl flex items-center justify-center text-xl">🔵</a>
                                        <a href="https://www.tiktok.com/@rom4ik45" target="_blank" title="TikTok" className="social-icon w-12 h-12 rounded-2xl flex items-center justify-center text-xl">📱</a>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-[#121215] p-8 rounded-3xl border border-white/5 text-center shadow-xl">
                                <h3 className="text-lg font-bold mb-4 uppercase tracking-widest text-blue-500">Графік роботи</h3>
                                <div className="space-y-2 text-base">
                                    <p className="text-white font-semibold">Пн-Пт: <span className="text-gray-400 font-normal">10:00 — 18:00</span></p>
                                    <p className="text-white font-semibold">Сб-Нд: <span className="text-gray-400 font-normal">11:00 — 18:00</span></p>
                                </div>
                            </div>
                        </div>

                        <div className="mt-16 pt-8 border-t border-white/5 text-center text-gray-500 text-xs">
                            © 2026 CROZALI. Всі права захищено.
                        </div>
                    </footer>

                    {/* Admin Access Button */}
                    <button 
                        onClick={() => isAdmin ? handleLogout() : setShowLogin(true)} 
                        className="fixed bottom-6 right-6 z-[100] bg-white/10 backdrop-blur-md px-4 py-3 rounded-full text-xs uppercase font-bold border border-white/20 hover:bg-blue-600 transition shadow-lg"
                    >
                        {isAdmin ? 'Вийти з Адмінки' : '🔑 Admin'}
                    </button>

                    {/* Admin Login Modal */}
                    {showLogin && (
                        <div className="fixed inset-0 z-[300] bg-black/90 backdrop-blur-sm flex items-center justify-center p-6">
                            <div className="bg-[#121215] p-8 rounded-3xl border border-blue-500/40 w-full max-w-sm shadow-2xl">
                                <h2 className="text-xl font-bold mb-4 text-white">Вхід в адмін-панель</h2>
                                <input 
                                    type="password" 
                                    placeholder="Введіть пароль" 
                                    className="admin-input" 
                                    value={loginPass} 
                                    onChange={e => setLoginPass(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleLogin()}
                                />
                                <button onClick={handleLogin} disabled={loginBusy} className="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold text-white transition mb-2 disabled:opacity-50">{loginBusy ? 'Вхід...' : 'Увійти'}</button>
                                <button onClick={() => setShowLogin(false)} className="w-full text-gray-400 hover:text-white text-xs py-2">Скасувати</button>
                            </div>
                        </div>
                    )}

                    {/* Add Product Modal */}
                    {showAddForm && (
                        <div className="fixed inset-0 z-[300] bg-black/95 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-[#121215] p-8 rounded-3xl border border-white/10 w-full max-w-lg my-8">
                                <h2 className="text-2xl font-bold mb-6 text-blue-500 uppercase">Додати модель</h2>
                                
                                <label className="text-xs text-gray-400 uppercase font-bold block mb-1">Назва моделі *</label>
                                <input 
                                    placeholder="напр. Лофери шкіряні" 
                                    className="admin-input" 
                                    value={newItem.name} 
                                    onChange={e => setNewItem({...newItem, name: e.target.value})} 
                                />
                                
                                <div className="grid grid-cols-2 gap-4 mb-2">
                                    <div>
                                        <label className="text-xs text-gray-400 uppercase font-bold block mb-1">Ціна (грн) *</label>
                                        <input 
                                            placeholder="напр. 3499" 
                                            type="number" 
                                            className="admin-input" 
                                            value={newItem.price} 
                                            onChange={e => setNewItem({...newItem, price: e.target.value})} 
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-400 uppercase font-bold block mb-1">Стара ціна (необов'язково)</label>
                                        <input 
                                            placeholder="напр. 3999" 
                                            type="number" 
                                            className="admin-input" 
                                            value={newItem.oldPrice} 
                                            onChange={e => setNewItem({...newItem, oldPrice: e.target.value})} 
                                        />
                                    </div>
                                </div>
                                
                                <label className="text-xs text-gray-400 uppercase font-bold block mb-1">Опис</label>
                                <textarea 
                                    placeholder="Короткий опис матеріалів та підошви..." 
                                    className="admin-input h-24" 
                                    value={newItem.description} 
                                    onChange={e => setNewItem({...newItem, description: e.target.value})} 
                                />
                                
                                <label className="text-xs text-gray-400 uppercase font-bold block mb-1">Посилання на фото (URL)</label>
                                <input 
                                    placeholder="URL Фото 1 (Обов'язково) *" 
                                    className="admin-input" 
                                    value={newItem.img1} 
                                    onChange={e => setNewItem({...newItem, img1: e.target.value})} 
                                />
                                <input 
                                    placeholder="URL Фото 2 (Опціонально)" 
                                    className="admin-input" 
                                    value={newItem.img2} 
                                    onChange={e => setNewItem({...newItem, img2: e.target.value})} 
                                />
                                <input 
                                    placeholder="URL Фото 3 (Опціонально)" 
                                    className="admin-input" 
                                    value={newItem.img3} 
                                    onChange={e => setNewItem({...newItem, img3: e.target.value})} 
                                />
                                
                                <label className="text-xs text-gray-400 uppercase font-bold block mb-1">Категорія</label>
                                <select 
                                    className="admin-input" 
                                    value={newItem.gender} 
                                    onChange={e => setNewItem({...newItem, gender: e.target.value})}
                                >
                                    <option value="male">Чоловіче взуття</option>
                                    <option value="female">Жіноче взуття</option>
                                </select>
                                
                                <div className="flex gap-4 mt-4">
                                    <button 
                                        onClick={handleAddProduct} 
                                        disabled={isSubmitting}
                                        className="flex-1 bg-blue-600 hover:bg-blue-500 py-3.5 rounded-xl font-bold text-white transition disabled:opacity-50"
                                    >
                                        {isSubmitting ? 'Збереження...' : 'ЗБЕРЕГТИ'}
                                    </button>
                                    <button 
                                        onClick={() => setShowAddForm(false)} 
                                        className="flex-1 bg-white/5 hover:bg-white/10 py-3.5 rounded-xl font-bold text-gray-300 transition"
                                    >
                                        СКАСУВАТИ
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
